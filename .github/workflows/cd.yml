name: Backend CD Pipeline (Develop to Main Merge)

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One job per service. Each builds its own Docker image, pushes it to Docker Hub,
# then tells Render to redeploy that service.
#
# Secrets needed in the repo:
#   DOCKER_USERNAME, DOCKER_PASSWORD
#   RENDER_DEPLOY_HOOK_POLL, RENDER_DEPLOY_HOOK_VOTE, RENDER_DEPLOY_HOOK_GATEWAY
jobs:
  build_and_push_docker:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - project: PollManage
            image: pollmanage
            hook: RENDER_DEPLOY_HOOK_POLL
          - project: VoteManage
            image: votemanage
            hook: RENDER_DEPLOY_HOOK_VOTE
          - project: ApiGateway
            image: apigateway
            hook: RENDER_DEPLOY_HOOK_GATEWAY

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The build context is the project folder, because each project has its own
      # Dockerfile that copies only that project.
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.project }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render Deploy
        run: curl -X GET "${{ secrets[matrix.hook] }}"

      - name: Report Production Deployment Status
        run: echo "${{ matrix.project }} image pushed to Docker Hub and Render deploy triggered."
