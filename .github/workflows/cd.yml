name: Backend CD Pipeline (Develop to Main Merge)

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One job per service. Each builds its own Docker image, pushes it to Docker Hub,
# then tells Render to redeploy that service.
#
# Secrets needed in the repo:
#   DOCKER_USERNAME, DOCKER_PASSWORD
#   RENDER_DEPLOY_HOOK_POLL, RENDER_DEPLOY_HOOK_VOTE, RENDER_DEPLOY_HOOK_GATEWAY
jobs:
  build_and_push_docker:
    runs-on: ubuntu-latest

    strategy:
      # Without this, one service failing cancels the other two mid-build, which hides
      # what actually went wrong.
      fail-fast: false
      matrix:
        include:
          - project: PollManage
            image: pollmanage
            hook: RENDER_DEPLOY_HOOK_POLL
          - project: VoteManage
            image: votemanage
            hook: RENDER_DEPLOY_HOOK_VOTE
          - project: ApiGateway
            image: apigateway
            hook: RENDER_DEPLOY_HOOK_GATEWAY

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The build context is the project folder, because each project has its own
      # Dockerfile that copies only that project.
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.project }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render Deploy
        env:
          # Named here so the secret is passed as a value, never pasted into the shell command.
          DEPLOY_HOOK: ${{ secrets[matrix.hook] }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "No deploy hook set for ${{ matrix.project }} yet. Image was still pushed to Docker Hub."
            exit 0
          fi
          # -f makes curl fail on a 4xx/5xx. Without it a wrong hook URL returns 404 and
          # curl still exits 0, so the pipeline would report a deploy that never happened.
          curl -fsS -X GET "$DEPLOY_HOOK"
          echo "Render deploy triggered for ${{ matrix.project }}."

      - name: Report Production Deployment Status
        run: echo "${{ matrix.project }} image pushed to Docker Hub and Render deploy triggered."
