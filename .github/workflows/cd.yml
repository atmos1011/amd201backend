# Continuous deployment: runs on every push to main. Builds and publishes one Docker image per
# service to Docker Hub, then triggers the matching Render deploy hook.
#
# Required repository secrets:
#   DOCKER_USERNAME, DOCKER_PASSWORD          - Docker Hub login
#   RENDER_DEPLOY_HOOK_GATEWAY                - deploy hook URL of the api-gateway service
#   RENDER_DEPLOY_HOOK_POLL                   - deploy hook URL of the poll service
#   RENDER_DEPLOY_HOOK_VOTING                 - deploy hook URL of the voting service
#   RENDER_DEPLOY_HOOK_REALTIME               - deploy hook URL of the realtime service
name: Backend CD Pipeline (Develop to Main Merge)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_push_docker:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: ApiGateway
            image: pollbuilder-gateway
          - service: PollService
            image: pollbuilder-poll
          - service: VotingService
            image: pollbuilder-voting
          - service: RealtimeService
            image: pollbuilder-realtime

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Each service has its own multi-stage Dockerfile, but the build context is the repository
      # root because they all compile the shared PollBuilder.Contracts project.
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_to_render:
    name: Trigger Render deploys
    runs-on: ubuntu-latest
    needs: build_and_push_docker

    steps:
      # The three back-end services are deployed first so the gateway never comes up pointing at
      # instances that are still restarting.
      - name: Deploy PollService
        run: curl --fail --silent --show-error "${{ secrets.RENDER_DEPLOY_HOOK_POLL }}"

      - name: Deploy VotingService
        run: curl --fail --silent --show-error "${{ secrets.RENDER_DEPLOY_HOOK_VOTING }}"

      - name: Deploy RealtimeService
        run: curl --fail --silent --show-error "${{ secrets.RENDER_DEPLOY_HOOK_REALTIME }}"

      - name: Deploy ApiGateway
        run: curl --fail --silent --show-error "${{ secrets.RENDER_DEPLOY_HOOK_GATEWAY }}"

      - name: Report Production Deployment Status
        run: echo "Pushed 4 images to Docker Hub and triggered all 4 Render deploys."
