name: Backend CD Pipeline (Develop to Main Merge)

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One job per service. Each builds its own Docker image, pushes it to Docker Hub,
# then tells Render to redeploy that service.
#
# Secrets needed in the repo:
#   DOCKER_USERNAME, DOCKER_PASSWORD
#   RENDER_DEPLOY_HOOK_POLL, RENDER_DEPLOY_HOOK_VOTE,
#   RENDER_DEPLOY_HOOK_RESULT, RENDER_DEPLOY_HOOK_GATEWAY
jobs:
  build_and_push_docker:
    runs-on: ubuntu-latest

    strategy:
      # Without this, one service failing cancels the other two mid-build, which hides
      # what actually went wrong.
      fail-fast: false
      matrix:
        include:
          - project: PollManage
            image: pollmanage
            hook: RENDER_DEPLOY_HOOK_POLL
          - project: VoteManage
            image: votemanage
            hook: RENDER_DEPLOY_HOOK_VOTE
          - project: ResultManage
            image: resultmanage
            hook: RENDER_DEPLOY_HOOK_RESULT
          - project: ApiGateway
            image: apigateway
            hook: RENDER_DEPLOY_HOOK_GATEWAY

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The build context is the project folder, because each project has its own
      # Dockerfile that copies only that project.
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.project }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render Deploy
        env:
          # Every hook is listed explicitly and the right one is picked in the script below.
          # Looking a secret up dynamically with secrets[matrix.hook] silently produced an
          # empty string, so the deploy step skipped even though the secrets existed.
          RENDER_DEPLOY_HOOK_POLL: ${{ secrets.RENDER_DEPLOY_HOOK_POLL }}
          RENDER_DEPLOY_HOOK_VOTE: ${{ secrets.RENDER_DEPLOY_HOOK_VOTE }}
          RENDER_DEPLOY_HOOK_RESULT: ${{ secrets.RENDER_DEPLOY_HOOK_RESULT }}
          RENDER_DEPLOY_HOOK_GATEWAY: ${{ secrets.RENDER_DEPLOY_HOOK_GATEWAY }}
          HOOK_NAME: ${{ matrix.hook }}
        run: |
          # Indirect expansion: read the variable whose NAME is in $HOOK_NAME.
          DEPLOY_HOOK="${!HOOK_NAME}"

          if [ -z "$DEPLOY_HOOK" ]; then
            echo "$HOOK_NAME is not set. Image was still pushed to Docker Hub."
            exit 0
          fi
          # -f makes curl fail on a 4xx/5xx. Without it a wrong hook URL returns 404 and
          # curl still exits 0, so the pipeline would report a deploy that never happened.
          curl -fsS -X GET "$DEPLOY_HOOK"
          echo "Render deploy triggered for ${{ matrix.project }}."

