# Runs the whole backend locally exactly as it is deployed: four services behind one gateway,
# talking to a real PostgreSQL. This is also how you reproduce a Render problem without deploying.
#
#   docker compose up --build
#   curl http://localhost:5000/api/polls -H "Content-Type: application/json" \
#        -d '{"question":"Tabs or spaces?","options":["Tabs","Spaces"]}'
#
# The gateway is the only service the SPA (or you) should call.

name: pollbuilder

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pollbuilder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pollbuilder"]
      interval: 5s
      timeout: 5s
      retries: 10

  poll-service:
    build:
      context: .
      dockerfile: src/PollService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=pollbuilder;Username=postgres;Password=postgres"
      Service__ApplyMigrationsOnStartup: "true"
      Service__ShareBaseUrl: "http://localhost:5173"
      Service__AllowedOrigins__0: "http://localhost:5173"
      Service__AllowedOrigins__1: "http://localhost:4173"
      # Close notifications go straight to the realtime service, not through the gateway.
      ServiceEndpoints__RealtimeBaseUrl: "http://realtime-service:8080"
      ServiceEndpoints__InternalApiKey: "local-dev-internal-key"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5101:8080"

  voting-service:
    build:
      context: .
      dockerfile: src/VotingService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=pollbuilder;Username=postgres;Password=postgres"
      Service__ApplyMigrationsOnStartup: "true"
      Service__AllowedOrigins__0: "http://localhost:5173"
      Service__AllowedOrigins__1: "http://localhost:4173"
      # Poll lookups go through the gateway; internal calls go straight to the service that owns them.
      ServiceEndpoints__GatewayBaseUrl: "http://api-gateway:8080"
      ServiceEndpoints__PollServiceBaseUrl: "http://poll-service:8080"
      ServiceEndpoints__RealtimeBaseUrl: "http://realtime-service:8080"
      ServiceEndpoints__InternalApiKey: "local-dev-internal-key"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5102:8080"

  realtime-service:
    build:
      context: .
      dockerfile: src/RealtimeService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Service__AllowedOrigins__0: "http://localhost:5173"
      Service__AllowedOrigins__1: "http://localhost:4173"
      ServiceEndpoints__InternalApiKey: "local-dev-internal-key"
    ports:
      - "5103:8080"

  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Service__AllowedOrigins__0: "http://localhost:5173"
      Service__AllowedOrigins__1: "http://localhost:4173"
      # ocelot.json already points at these container names, so these lines are only here to make
      # the wiring explicit and to prove the same override path used on Render works locally.
      Downstream__PollService: "http://poll-service:8080"
      Downstream__VotingService: "http://voting-service:8080"
      Downstream__RealtimeService: "http://realtime-service:8080"
    depends_on:
      - poll-service
      - voting-service
      - realtime-service
    ports:
      - "5000:8080"

volumes:
  postgres-data:
